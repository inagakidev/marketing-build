# Phase 0 minimum CI (QUAL-05): blocks basic regressions before merging.
# The order follows docs/ARCHITECTURE.md §14.3. E2E on preview and a release
# step with migrations come once the deploy is configured.
name: CI

on:
  pull_request:
  push:
    branches: [main, front]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: briefing
          POSTGRES_PASSWORD: briefing
          POSTGRES_DB: briefing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U briefing -d briefing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://briefing:briefing@localhost:5432/briefing?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # No Supabase in CI: authenticated routes answer 401, which is what the
      # negative tests expect; the session is simulated where it must exist.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar client do Prisma
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Migrações e catálogo
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Testes de integração (PostgreSQL)
        run: npm run test:db

      - name: Build
        run: npm run build
