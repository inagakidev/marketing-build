services:
  postgres:
    image: postgres:16-alpine
    container_name: briefing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: briefing
      POSTGRES_PASSWORD: briefing
      POSTGRES_DB: briefing
    ports:
      - "5432:5432"
    volumes:
      - briefing-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefing -d briefing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  briefing-pgdata:
